"$schema" = 'https://starship.rs/config-schema.json'

# 1行目: 左に dir/repo名/git、$fill で右端に寄せて status 系。2行目: プロンプト記号
format = """
${custom.worktree}$directory${custom.gitrepo}$git_branch$git_status$fill$status$cmd_duration$jobs$direnv$golang$nodejs$python$kubernetes$terraform$aws$time$line_break$character"""

add_newline = true

[directory]
truncation_length = 5
truncate_to_repo = true

# 表示: dir (repo名 / ブランチ)。括弧は gitrepo と git_branch で分担している
[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)\) '

[git_status]
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

# linked worktree にいるとき、$directory (worktree root 以下に切り詰められる) の手前に
# 本体リポジトリ名から worktree 直前までのパスを補う
# 本体ディレクトリ配下にない worktree は "本体名/…/" と省略する
[custom.worktree]
command = '''
top=$(git rev-parse --show-toplevel)
main=$(git rev-parse --path-format=absolute --git-common-dir)
main=${main%/.git}
[ "$top" = "$main" ] && exit 0
base=${main%/*}
case "$top" in
  "$base"/*) rel=${top#"$base"/}; printf '%s/' "${rel%/*}" ;;
  *) printf '%s/…/' "${main##*/}" ;;
esac
'''
when = 'git rev-parse --is-inside-work-tree'
format = '[$output]($style)'
style = 'bold cyan'
ignore_timeout = true

# origin URL 末尾のリポジトリ名 (worktree やclone先ディレクトリ名に依存しない)
[custom.gitrepo]
command = 'git config --get remote.origin.url | sed -E "s#.*[/:]##; s#\.git\$##"'
when = 'git rev-parse --is-inside-work-tree'
format = '\([$output]($style) / '
style = 'bold yellow'
ignore_timeout = true

[fill]
symbol = ' '

[status]
disabled = false

[jobs]
symbol = '✦'

[direnv]
disabled = false

[kubernetes]
disabled = true

[aws]
disabled = true

[time]
disabled = false

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[java]
disabled = true

[package]
version_format = "${raw}"
