"$schema" = 'https://starship.rs/config-schema.json'

# 1行目: 左に os/dir/git、$fill で右端に寄せて status 系。2行目: プロンプト記号
format = """
$os$directory$git_branch$git_status$fill$status$cmd_duration$jobs$direnv$python$kubernetes$terraform$aws$time$line_break$character"""

add_newline = true

[os]
disabled = false
format = '[$symbol]($style) '

[directory]
truncation_length = 9

[fill]
symbol = ' '

[status]
disabled = false

[jobs]
symbol = '✦'

[direnv]
disabled = false

[kubernetes]
disabled = false

[aws]
disabled = true

[time]
disabled = false

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[java]
disabled = true

[package]
version_format = "${raw}"
