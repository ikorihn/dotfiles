onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+q"

# tmux の prefix キーバインド
new_tab = ["super+t", "alt+n"]
previous_tab = ["alt+left", "alt+h"]
next_tab = ["alt+right", "alt+l"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "alt+v"
split_horizontal = "alt+s"
copy_mode = "prefix+["
edit_scrollback = "alt+e"
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
close_pane = "super+w"
next_agent = "super+]"
previous_agent = "super+["
last_pane = "alt+["

[[keys.command]]
key = "alt+o"
type = "pane"
command = "$HERDR_BIN_PATH pane read \"$HERDR_ACTIVE_PANE_ID\" --source recent-unwrapped --lines 10000 | nvim -"
description = "直近の出力をnvimで開く"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "tig"
description = "tigを開く"

[[keys.command]]
key = "prefix+ctrl+t"
type = "pane"
command = "fzf | tr -d '\\n' | pbcopy"
description = "fzfの選択内容をコピー"

[[keys.command]]
key = "prefix+alt+t"
type = "shell"
command = "herdr pane move $HERDR_ACTIVE_PANE_ID --new-tab --focus"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[ui.toast]
delivery = "system"
